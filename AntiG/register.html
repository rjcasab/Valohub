<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VALOHUB - Registrarse</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Specific styles matching login.html */
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: var(--dark-bg);
            background-image: linear-gradient(135deg, rgba(83, 33, 43, 0.8) 0%, rgba(15, 25, 35, 1) 60%);
        }

        .auth-container {
            background-color: var(--darker-bg);
            padding: 40px;
            border-radius: 4px;
            /* Sharp corners like Valorant UI */
            width: 100%;
            max-width: 400px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            border: 1px solid var(--text-gray);
            position: relative;
            overflow: hidden;
        }

        .auth-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background-color: var(--primary-red);
        }

        .auth-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .auth-header h2 {
            font-family: var(--font-heading);
            font-size: 2.5rem;
            color: white;
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            color: var(--text-gray);
            font-weight: bold;
            font-size: 0.9rem;
            margin-bottom: 5px;
            text-transform: uppercase;
        }

        .form-input {
            width: 100%;
            padding: 12px;
            background-color: rgba(255, 255, 255, 0.1);
            border: 1px solid transparent;
            border-radius: 4px;
            color: white;
            font-family: var(--font-body);
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--primary-red);
            background-color: rgba(255, 255, 255, 0.15);
        }

        .auth-links {
            margin-top: 20px;
            text-align: center;
            font-size: 0.9rem;
        }

        .auth-links a {
            color: var(--primary-red);
            text-decoration: none;
            font-weight: bold;
            transition: color 0.2s;
        }

        .auth-links a:hover {
            color: white;
            text-decoration: underline;
        }

        .back-link {
            position: absolute;
            top: 20px;
            left: 20px;
            color: var(--text-gray);
            text-decoration: none;
            font-weight: bold;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 5px;
            transition: color 0.2s;
        }

        .back-link:hover {
            color: white;
        }
    </style>
</head>

<body>
    <a href="index.html" class="back-link">← Volver</a>

    <div class="auth-container">
        <div class="auth-header">
            <h2>Registrarse</h2>
            <p style="color: var(--text-gray);">Únete a la batalla, agente.</p>
        </div>

        <form id="registerForm">
            <div class="form-group">
                <label for="username">Usuario</label>
                <input type="text" id="username" class="form-input" required placeholder="JettMain123">
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" class="form-input" required placeholder="agente@valorant.com">
            </div>

            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" class="form-input" required placeholder="••••••••">
            </div>

            <button type="submit" class="cta-btn" style="width: 100%; margin-top: 10px;">Crear Cuenta</button>
        </form>

        <div class="auth-links">
            <p style="color: var(--text-gray);">¿Ya tienes cuenta? <a href="login.html">Inicia sesión aquí</a></p>
        </div>
    </div>
    <script src="main.js"></script>
</body>

</html>
